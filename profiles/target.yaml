open_issues:
  - id: session_never_ends_on_repeated_unknown
    severity: high
    status: "在本轮(engine.js 22:22 重写)后仍未修复 —— 代码结构变了,缺陷保留了"
    where: "src/services/engine.js e.submitStudy() 第 17 行"
    symptom: "只要有一个词用户每次都点『不认识』,本轮学习永远无法结束(进不到 summary)"
    cause: >
      target=e.targets[id]||(known?2:4)。首次答『不认识』→ targets[id]=4;
      而每次答『不认识』都执行 if(!known)e.rounds[id]=0,把连对计数清零。
      于是该词必须「连续 4 次答对」才出队,但只要中途再遇到它一次就归零重来。
      同时答对时把该词 splice 回队列,队列只增不减 → 无限循环。
    repro: |
      node -e "
      const fs=require('fs');
      let src=fs.readFileSync('src/services/engine.js','utf8').replace(/^export function/m,'function');
      const createEngine=new Function(src+';return createEngine;')();
      const dict={id:'d1',name:'t',words:Array.from({length:30},(_,i)=>({id:i+1,word:'w'+i,translation:'t'+i}))};
      const e=createEngine([dict],{dictId:'d1',batchSize:6},()=>{});
      e.startStudy();
      const hard=new Set(e.queue.slice(0,1).map(w=>w.id));   // 只有 1 个词始终不认识
      let g=0; while(e.page!=='summary'&&g<3000){g++;
        e.chooseStudyRating(hard.has(e.current.id)?1:0); e.submitStudy(); }
      console.log('steps',g,'page',e.page,'queueLen',e.queue.length);  // 3000 study 3007
      "
    measured: >
      1 个词始终『不认识』(其余全认识): 100/100 局永不终止 — 这是最贴近真实用户的情形。
      对抗性交替(认识/不认识 严格交替): 50/50 局不终止。
      1/3 固定漏答: 37/50 局不终止。
      随机知识率 90~50% 均可终止(最坏 304 步) —— 因为迟早会出现 4 连对。
    impact: "用户只要遇到一个真正记不住的词,本轮就卡死,无法完成、无法看总结。"
    suggested_fix: >
      任选其一,改完请跑 tools/check.js 里的回归用例(已内置该场景,当前会 FAIL):
      (a) 去掉 if(!known)e.rounds[id]=0 —— 改为「累计答对次数」达到 target 即出队(不要求连对);
      (b) 保留连对语义,但给队列/重插次数设硬上界,超出即强制出队;
      (c) 『不认识』不提高 target,仅把该词放回队列末尾,避免门槛随答错而升高。
